<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Meine Fußballkarriere 2.0</title>
<style>
:root{--bg:#07111f;--panel:#101d31;--panel2:#162842;--line:#2c4667;--text:#eef5ff;--muted:#9eb2cb;--blue:#3da4ff;--green:#22c98a;--gold:#f2b84b;--red:#e35c69}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#15345a 0,#07111f 45%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1150px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.brand{display:flex;gap:10px;align-items:center}.logo{font-size:30px;background:#183253;padding:9px 12px;border-radius:15px}h1{font-size:21px;margin:0}h2{margin:0 0 7px}h3{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}
button{border:0;border-radius:10px;padding:10px 13px;background:var(--blue);color:white;font-weight:800;cursor:pointer}button.dark{background:#253a57}button.green{background:var(--green)}button.gold{background:var(--gold);color:#18202a}button.red{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px}.stat,.panel,.choice,.news{background:linear-gradient(180deg,#11213a,#0e192a);border:1px solid var(--line);border-radius:15px}.stat{padding:10px}.stat b{display:block;font-size:18px;margin-top:3px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.nav button{white-space:nowrap}.nav button.active{background:var(--blue)}
.panel{padding:16px;margin-bottom:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{padding:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.chip{display:inline-block;background:#203855;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px}.bar{height:8px;background:#243851;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#3da4ff,#8164ff)}.news{padding:9px;margin:6px 0}.small{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #213650;text-align:left}.modalbg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#101d31;border:1px solid #416386;border-radius:18px;padding:18px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.avatar{font-size:58px;text-align:center;background:#162b47;border-radius:18px;padding:12px}.score{font-size:36px;font-weight:900}.toast{position:fixed;right:14px;bottom:14px;background:#17304f;border:1px solid #3d5c7e;padding:12px 14px;border-radius:11px;display:none}
@media(max-width:800px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div class="brand"><div class="logo">⚽</div><div><h1>Meine Fußballkarriere 2.0</h1><div class="muted">Dein Fußball. Dein Geld. Dein Leben.</div></div></div>
<button class="red" onclick="resetGame()">Neue Karriere</button>
</header>
<div id="stats" class="stats"></div>
<div id="nav" class="nav"></div>
<main id="main"></main>
<section class="panel"><h3>📰 Karriere-News</h3><div id="feed"></div></section>
<div class="muted" style="text-align:center">Version 2.0 · fiktive Vereine und Spieler · Spielstand lokal im Browser</div>
</div>
<div id="modalbg" class="modalbg"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
const clubs=[
["SV Graz 09",1,61,"Graz"],["FC Linz",2,67,"Linz"],["SK Wien",3,73,"Wien"],["Borussia Rhein",4,79,"Düsseldorf"],["FC München Nord",5,84,"München"],["London Athletic",6,88,"London"],["Madrid Unión",7,91,"Madrid"],["Paris Etoile",8,93,"Paris"]
].map(x=>({name:x[0],level:x[1],base:x[2],city:x[3]}));
const initial={name:"Dein Spieler",age:17,week:1,season:1,club:"SV Graz 09",position:"ZM",rating:61,potential:90,
pace:62,shooting:58,passing:67,dribbling:64,defending:51,physical:60,form:74,fitness:88,energy:84,morale:78,fame:3,
money:2500,salary:0,contractWeeks:0,marketValue:75000,relationship:58,education:70,housing:"Elternhaus",car:"Kein Auto",
investments:0,business:0,agent:"Kein Berater",sponsor:"Kein Sponsor",sponsorIncome:0,social:1200,
goals:0,assists:0,injuries:0,training:0,offers:[],news:[],achievements:[],children:0,married:false,
nationalCaps:0,nationalGoals:0,champions:0,worldCup:0,careerEnded:false,created:false};
let s=load()||structuredClone(initial),tab="home";
const $=id=>document.getElementById(id), euro=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Math.round(n));
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
function save(){localStorage.setItem("mfk_2",JSON.stringify(s))}
function log(t){s.news.unshift(`S${s.season} W${s.week} · ${t}`);s.news=s.news.slice(0,80)}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}
function setTab(t){tab=t;render()}
function club(){return clubs.find(c=>c.name===s.club)||clubs[0]}
function resetGame(){if(confirm("Neue Karriere starten?")){localStorage.removeItem("mfk_2");s=structuredClone(initial);tab="home";log("Willkommen. Erstelle deinen Spieler.");render()}}
function render(){
$("stats").innerHTML=[["Verein",s.club],["Alter",s.age],["Stärke",s.rating],["Marktwert",euro(s.marketValue)],["Form",s.form+"%"],["Vermögen",euro(s.money)]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join("");
$("nav").innerHTML=["home|🏠 Übersicht","career|🏟️ Karriere","market|🔄 Transfers","life|❤️ Leben","money|💰 Finanzen","media|📱 Medien","national|🇩🇪 Nationalteam","profile|👤 Spieler"].map(x=>{let[a,b]=x.split("|");return `<button class="${tab===a?"active":"dark"}" onclick="setTab('${a}')">${b}</button>`}).join("");
({home,career,market,life,money,media,national,profile}[tab])();
$("feed").innerHTML=s.news.slice(0,8).map(x=>`<div class="news">${x}</div>`).join("");
save();
}
function home(){
$("main").innerHTML=`<section class="panel"><div class="grid"><div><div class="muted">SAISON ${s.season} · WOCHE ${s.week}</div><h2>${s.club}</h2><p>Du bist ${s.age} Jahre alt. Jede Woche kann deine Karriere verändern.</p><span class="chip">${s.position}</span><span class="chip">Potenzial ${s.potential}</span><span class="chip">Gehalt ${euro(s.salary)}/Monat</span></div><div class="avatar">🧑‍⚽<div class="score">${s.rating}</div><div class="small">GESAMTSTÄRKE</div></div></div></section>
<div class="grid"><section class="panel"><h2>🎮 Spielwoche</h2><p class="muted">Eine Hauptaktion lässt die Karriere eine Woche weiterlaufen.</p><div class="tabs"><button onclick="train()">🏋️ Training</button><button class="dark" onclick="rest()">😴 Regeneration</button><button class="green" onclick="match()">⚽ Spiel</button></div></section>
<section class="panel"><h2>💬 Karriere-Moment</h2><p>Berater, Trainer, Medien oder Familie können dir Entscheidungen abverlangen.</p><button class="gold" onclick="decision()">Entscheidung</button></section></div>
<section class="panel"><h2>⭐ Nächste Ziele</h2><div class="grid"><div class="choice">Marktwert: <b>${euro(s.marketValue)}</b></div><div class="choice">Social Media: <b>${s.social.toLocaleString("de-DE")}</b> Follower</div><div class="choice">Nationalteam: <b>${s.nationalCaps}</b> Einsätze</div><div class="choice">Champions League: <b>${s.champions}</b> Titel</div></div></section>`}
function career(){
$("main").innerHTML=`<section class="panel"><h2>🏟️ Spielerentwicklung</h2><div class="grid">
${attr("Tempo",s.pace)}${attr("Schuss",s.shooting)}${attr("Pass",s.passing)}${attr("Dribbling",s.dribbling)}${attr("Defensive",s.defending)}${attr("Physis",s.physical)}
</div><div class="choice"><h3>Gesamtstärke ${s.rating}/${s.potential}</h3><div class="bar"><div class="fill" style="width:${s.rating/s.potential*100}%"></div></div><p class="small">Training ${s.training} · Form ${s.form}% · Fitness ${s.fitness}% · Energie ${s.energy}%</p></div></section>
<section class="panel"><h2>📊 Karriere-Statistik</h2><table><tr><th>Wert</th><th>Karriere</th></tr><tr><td>Tore</td><td>${s.goals}</td></tr><tr><td>Assists</td><td>${s.assists}</td></tr><tr><td>Verletzungen</td><td>${s.injuries}</td></tr><tr><td>Nationalteam-Tore</td><td>${s.nationalGoals}</td></tr><tr><td>Champions-League-Titel</td><td>${s.champions}</td></tr><tr><td>Weltmeisterschaften</td><td>${s.worldCup}</td></tr></table></section>`}
function attr(name,v){return `<div class="choice"><b>${name}</b><div class="bar"><div class="fill" style="width:${v}%"></div></div><span class="small">${v}</span></div>`}
function market(){
let offers=s.offers.map((o,i)=>`<div class="choice"><div class="row"><div><h3>${o.club}</h3><p>${euro(o.salary)}/Monat · ${o.years} Jahre · ${o.role}<br>Bonus ${euro(o.bonus)}</p></div><div class="tabs"><button class="green" onclick="accept(${i})">Annehmen</button><button class="dark" onclick="reject(${i})">Ablehnen</button><button class="gold" onclick="counter(${i})">Verhandeln</button></div></div></div>`).join("");
$("main").innerHTML=`<section class="panel"><h2>🔄 Transfermarkt</h2><p class="muted">Du kannst Angebote annehmen, ablehnen oder nachverhandeln.</p>${offers||"<div class='choice'>Keine Angebote. Gute Leistungen und Bekanntheit ziehen Scouts an.</div>"}</section>
<section class="panel"><h2>🤝 Berater & Sponsoren</h2><div class="grid"><div class="choice"><h3>Berater</h3><p>${s.agent}</p><button onclick="hireAgent()">Berater engagieren</button></div><div class="choice"><h3>Sponsor</h3><p>${s.sponsor}</p><button onclick="getSponsor()">Sponsor suchen</button></div></div></section>`}
function life(){
$("main").innerHTML=`<section class="panel"><h2>❤️ Privatleben</h2><div class="grid"><div class="choice"><h3>Familie</h3><div class="bar"><div class="fill" style="width:${s.relationship}%"></div></div><p>${s.relationship}% · Kinder ${s.children}</p><button onclick="family()">Zeit mit Familie</button>${!s.married?`<button class="dark" onclick="marry()">Heiraten</button>`:"<span class='chip'>Verheiratet</span>"}</div>
<div class="choice"><h3>Bildung</h3><div class="bar"><div class="fill" style="width:${s.education}%"></div></div><button onclick="edu()">Weiterbilden</button></div>
<div class="choice"><h3>🏠 ${s.housing}</h3><button onclick="buy('flat')">Wohnung ${euro(30000)}</button><button class="dark" onclick="buy('house')">Haus ${euro(180000)}</button></div>
<div class="choice"><h3>🚗 ${s.car}</h3><button onclick="buy('sport')">Sportwagen ${euro(80000)}</button><button class="dark" onclick="buy('lux')">Luxuswagen ${euro(180000)}</button></div></div></section>`}
function money(){
$("main").innerHTML=`<section class="panel"><h2>💰 Finanzleben</h2><div class="grid"><div class="choice"><h3>Vermögen</h3><div class="score">${euro(s.money)}</div></div><div class="choice"><h3>Monatsgehalt</h3><div class="score">${euro(s.salary)}</div></div><div class="choice"><h3>Investments</h3><p>${euro(s.investments)}</p><button class="green" onclick="invest()">50.000 € investieren</button></div><div class="choice"><h3>Unternehmen</h3><p>${euro(s.business)}</p><button class="gold" onclick="business()">Unternehmen gründen – 100.000 €</button></div></div></section>`}
function media(){
$("main").innerHTML=`<section class="panel"><h2>📱 Medien & Öffentlichkeit</h2><div class="grid"><div class="choice"><h3>Social Media</h3><div class="score">${s.social.toLocaleString("de-DE")}</div><p>Follower</p><button onclick="socialPost()">Post veröffentlichen</button></div><div class="choice"><h3>Bekanntheit</h3><div class="score">${s.fame}</div><p>Öffentlicher Bekanntheitswert</p><button class="gold" onclick="press()">Pressekonferenz</button></div></div></section>`}
function national(){
let eligible=s.age>=18;
$("main").innerHTML=`<section class="panel"><h2>🇩🇪 Nationalmannschaft</h2>${eligible?`<p>Deine Leistungen können dir eine Einladung bringen.</p><div class="choice"><h3>Nationalteam</h3><p>Einsätze ${s.nationalCaps} · Tore ${s.nationalGoals}</p><button class="green" onclick="nationalMatch()">Länderspiel bestreiten</button></div>`:`<p class="muted">Ab 18 kannst du für die Nationalmannschaft nominiert werden.</p>`}
<section class="choice"><h3>🏆 Weltmeisterschaft</h3><p>Weltmeisterschaften: ${s.worldCup}</p></section></section>`}
function profile(){
$("main").innerHTML=`<section class="panel"><h2>👤 Spielerprofil</h2><div class="grid"><div class="choice"><h3>${s.name}</h3><p>Position ${s.position}<br>Alter ${s.age}<br>Marktwert ${euro(s.marketValue)}</p></div><div class="choice"><h3>Mentale Werte</h3><p>Moral ${s.morale}% · Energie ${s.energy}% · Beziehung ${s.relationship}%</p></div><div class="choice"><h3>Vertrag</h3><p>${s.contractWeeks?s.contractWeeks+" Wochen":"Kein Profivertrag"}<br>${euro(s.salary)}/Monat</p></div><div class="choice"><h3>🏆 Erfolge</h3><p>${s.achievements.length?s.achievements.join("<br>"):"Noch keine."}</p></div></div></section>`}
function train(){
let r=Math.random()<.7?1:2;s.rating=clamp(Math.min(s.potential,s.rating+r));s.pace=clamp(s.pace+(Math.random()<.3?1:0));s.passing=clamp(s.passing+1);s.training++;s.fitness-=10;s.energy-=15;s.form=clamp(s.form+3);updateValue();log("🏋️ Training: Deine Entwicklung macht Fortschritte.");advance();render()}
function rest(){s.fitness=clamp(s.fitness+16);s.energy=clamp(s.energy+20);s.form=clamp(s.form-1);log("😴 Du regenerierst.");advance();render()}
function match(){
let p=s.rating+s.form*.55+s.fitness*.28+s.morale*.18+Math.random()*25-10;
if(s.fitness<28&&Math.random()<.2){s.injuries++;s.fitness=20;log("🚑 Verletzung im Spiel.");}
else{let great=p>150,good=p>123;
if(great){if(Math.random()<.6)s.goals++;if(Math.random()<.6)s.assists++;s.fame+=4;s.social+=Math.floor(Math.random()*8000)+3000;s.form=clamp(s.form+9);s.morale=clamp(s.morale+5);log("⭐ Überragender Auftritt! Scouts und Medien sprechen über dich.");if(Math.random()<.7)offer()}
else if(good){if(Math.random()<.25)s.goals++;if(Math.random()<.35)s.assists++;s.fame+=2;s.social+=Math.floor(Math.random()*2500)+500;s.form=clamp(s.form+5);s.morale=clamp(s.morale+2);log("👍 Gute Leistung.");}
else{s.form=clamp(s.form-7);s.morale=clamp(s.morale-4);log("😕 Schwieriger Spieltag.");}s.fitness-=12}
updateValue();advance();render()}
function updateValue(){s.marketValue=Math.max(25000,Math.round(s.rating*s.rating*18*(1+s.fame/100)))}
function offer(){let cur=club().level,pool=clubs.filter(c=>c.level>cur&&c.level<=cur+2),c=pool[Math.floor(Math.random()*pool.length)]||clubs[Math.min(cur,clubs.length-1)];let sal=Math.round((2800+c.level*c.level*2500)*(0.85+Math.random()*.4));s.offers.push({club:c.name,salary:sal,years:2+Math.floor(Math.random()*3),role:s.rating>=c.base-3?"Stammspieler":"Rotation",bonus:Math.round(sal*.8)});log("📨 "+c.name+" bietet dir einen Vertrag an.")}
function accept(i){let o=s.offers[i];s.club=o.club;s.salary=o.salary;s.contractWeeks=o.years*52;s.money+=o.bonus;s.rating=clamp(Math.min(s.potential,s.rating+1));s.fame+=4;s.offers=[];log("✈️ Transfer zu "+o.club+" unterschrieben.");advance();render()}
function reject(i){let o=s.offers.splice(i,1)[0];log("Du lehnst "+o.club+" ab.");render()}
function counter(i){let o=s.offers[i];o.salary=Math.round(o.salary*1.18);o.bonus=Math.round(o.bonus*1.15);o.role="Stammspieler-Verhandlung";log("🤝 Du verlangst mehr Geld. "+o.club+" prüft dein Gegenangebot.");render()}
function hireAgent(){if(s.agent!=="Kein Berater"){toast("Du hast bereits einen Berater.");return}s.agent="Top-Agent";s.money=Math.max(0,s.money-5000);log("🤝 Du engagierst einen Berater.");render()}
function getSponsor(){if(s.sponsor!=="Kein Sponsor"){toast("Du hast bereits einen Sponsor.");return}s.sponsor="Sportmarke";s.sponsorIncome=3000;s.fame+=3;log("📢 Ein Sponsor bietet dir 3.000 € monatlich.");render()}
function family(){s.relationship=clamp(s.relationship+10);s.energy=clamp(s.energy+5);log("❤️ Du verbringst Zeit mit deiner Familie.");advance();render()}
function marry(){s.married=true;s.relationship=clamp(s.relationship+12);s.money-=5000;log("💍 Du heiratest.");advance();render()}
function edu(){s.education=clamp(s.education+8);s.energy-=5;log("📚 Du bildest dich weiter.");advance();render()}
function buy(x){let cost=x==="flat"?30000:x==="house"?180000:x==="sport"?80000:180000;if(s.money<cost){toast("Nicht genug Geld.");return}s.money-=cost;if(x==="flat")s.housing="Eigene Wohnung";if(x==="house")s.housing="Eigenes Haus";if(x==="sport")s.car="Sportwagen";if(x==="lux")s.car="Luxuswagen";log("🏠🚗 Du investierst in deinen Lebensstil.");render()}
function invest(){if(s.money<50000){toast("Du brauchst 50.000 €.");return}s.money-=50000;s.investments+=50000;log("💼 Du investierst 50.000 €.");render()}
function business(){if(s.money<100000){toast("Du brauchst 100.000 €.");return}s.money-=100000;s.business=100000;s.achievements.push("Unternehmer");log("💼 Du gründest dein erstes Unternehmen.");render()}
function socialPost(){s.social+=Math.floor(Math.random()*12000)+1000;s.fame+=1;log("📱 Dein neuer Post geht viral.");render()}
function press(){let x=Math.random();if(x<.65){s.fame+=3;s.social+=5000;log("🎤 Gute Pressekonferenz. Die Fans lieben deine Aussagen.")}else{s.morale-=3;log("🎤 Eine Aussage sorgt für Diskussionen.")}render()}
function nationalMatch(){if(s.age<18){toast("Noch zu jung.");return}let p=s.rating+s.form*.5+Math.random()*30;if(p>120){s.nationalCaps++;if(Math.random()<.25)s.nationalGoals++;s.fame+=5;log("🇩🇪 Du überzeugst im Länderspiel.")}else{log("🇩🇪 Schwaches Länderspiel.");}if(s.nationalCaps>10&&s.nationalGoals>3&&Math.random()<.08){s.worldCup++;s.achievements.push("Weltmeister");log("🏆 Du gewinnst die Weltmeisterschaft!")}advance();render()}
function decision(){
let opts=[
["💰 Geld","Maximiere deinen nächsten Vertrag.",()=>{s.fame+=2;offer();log("Dein Berater fordert beim Vertrag mehr Geld.")}],
["🏟️ Spielzeit","Entwicklung vor Gehalt.",()=>{s.rating=clamp(Math.min(s.potential,s.rating+1));s.form=clamp(s.form+5);log("Du priorisierst Spielzeit.")}],
["❤️ Familie","Privatleben schützen.",()=>{s.relationship=clamp(s.relationship+10);s.energy=clamp(s.energy+8);log("Du stellst Familie an erste Stelle.")}],
["🤝 Loyalität","Beim Verein bleiben.",()=>{s.morale=clamp(s.morale+6);log("Deine Loyalität kommt gut an.")}],
["📱 Medien","Mehr Öffentlichkeit wagen.",()=>{s.social+=15000;s.fame+=4;log("Du gehst offensiv mit den Medien um.")}]
];
$("modal").innerHTML=`<h2>💬 Große Karriereentscheidung</h2><p>Was ist dir momentan am wichtigsten?</p>`+opts.map((o,i)=>`<div class="choice"><h3>${o[0]}</h3><p>${o[1]}</p><button onclick="choose(${i})">Entscheiden</button></div>`).join("");$("modalbg").style.display="flex";window.opts=opts}
function choose(i){window.opts[i][2]();close();advance();render()}
function close(){$("modalbg").style.display="none"}
function advance(){
s.week++;s.fitness=clamp(s.fitness);s.energy=clamp(s.energy);s.morale=clamp(s.morale);s.relationship=clamp(s.relationship);
if(s.contractWeeks>0)s.contractWeeks--;
if(s.week>52){s.week=1;s.season++;s.age++;if(s.rating<s.potential)s.rating++;if(s.salary)s.money+=s.salary*12;if(s.sponsorIncome)s.money+=s.sponsorIncome*12;s.marketValue=Math.round(s.marketValue*1.08);log("🏆 Saison beendet. Du wirst ein Jahr älter.");if(s.age>=25&&!s.achievements.includes("Profi etabliert"))s.achievements.push("Profi etabliert")}
else if(s.week%4===0){if(s.salary)s.money+=s.salary;if(s.sponsorIncome)s.money+=s.sponsorIncome;if(s.business)s.money+=3000}
if(s.age>=35){s.careerEnded=true;log("🏁 Deine aktive Karriere endet.");}
}
if(!s.news.length)log("Willkommen. Dein Ziel: Vom Talent zum Weltstar.");
render();
</script>
</body></html>
